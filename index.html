<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   PART 2 OF 3: LOOK AND FEEL (optional to edit)
   Needs a background picture named bg.jpg in the same folder.
   ===================================================================== */

/* ---------- COLORS: safe to edit ---------- */
:root {
  --text: #ffffff;
  --muted: rgba(255, 245, 230, .92);
  --card: rgba(30, 18, 12, .70);          /* box fill */
  --card-hover: rgba(52, 30, 18, .82);    /* box fill when hovered */
  --border: rgba(255, 210, 150, .55);     /* box outline */
  --gold: #ffd27a;                        /* hover glow and accents */
  --gold-light: #ffd9a0;                  /* tagline color */
  --btn-top: #ffc15a;                     /* highlighted button, top */
  --btn-bottom: #ff7a3c;                  /* highlighted button, bottom */
  --btn-text: #2a1405;                    /* highlighted button text */
  --shade-top: rgba(0, 0, 0, .22);        /* darkening over the picture */
  --shade-bottom: rgba(0, 0, 0, .55);
}

/* ---------- LAYOUT: you can leave this alone ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Poppins", system-ui, sans-serif;
  background: #2a1a3a;
  color: var(--text);
  min-height: 100vh; display: flex; justify-content: center;
  padding: 52px 18px; line-height: 1.4;
}

/* background picture (stays fixed, works on phones too) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background:
    linear-gradient(var(--shade-top), var(--shade-bottom)),
    url("bg.jpg") center / cover no-repeat;
}

main { width: 100%; max-width: 520px; text-align: center; }

.avatar {
  width: 128px; height: 128px; border-radius: 12px; object-fit: cover;
  border: 3px solid var(--gold);
  box-shadow: 6px 6px 0 rgba(0, 0, 0, .55);
  background: var(--card); margin-bottom: 22px;
}

/* Title */
h1 {
  font-family: "Silkscreen", sans-serif; font-weight: 700;
  font-size: clamp(1.5rem, 6vw, 2.3rem); line-height: 1.2;
  letter-spacing: .04em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff, #ffd9a0);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, .6));
}

/* Tagline and bio */
.tagline {
  font-family: "VT323", monospace;
  font-size: clamp(1.3rem, 4.5vw, 1.7rem);
  letter-spacing: .12em; margin-top: 8px; color: var(--gold-light);
  text-shadow: 2px 2px 0 rgba(0, 0, 0, .7);
}
.bio {
  font-family: "VT323", monospace;
  font-size: 1.35rem; max-width: 40ch; margin: 10px auto 0;
  color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .75);
}

.links { margin-top: 34px; display: flex; flex-direction: column; gap: 16px; }

/* Section headings (centered, line on both sides) */
.section-title {
  font-family: "Silkscreen", sans-serif; font-weight: 700;
  font-size: .85rem; letter-spacing: .22em; text-transform: uppercase;
  margin: 16px 0 -2px;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  color: var(--gold-light); text-shadow: 2px 2px 0 rgba(0, 0, 0, .8);
}
.section-title::before, .section-title::after {
  content: ""; flex: 1; height: 2px;
}
.section-title::before { background: linear-gradient(270deg, rgba(255,210,150,.8), transparent); }
.section-title::after  { background: linear-gradient(90deg,  rgba(255,210,150,.8), transparent); }

/* The boxes (blocky, with hard shadow) */
.link {
  position: relative; display: block; text-decoration: none; color: var(--text);
  text-align: center; padding: 20px 52px; border-radius: 6px;
  background: var(--card);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border: 2px solid var(--border);
  box-shadow: 5px 5px 0 rgba(0, 0, 0, .55);
  transition: transform .12s ease, border-color .12s ease,
              box-shadow .12s ease, background .12s ease;
}
.link:hover, .link:focus-visible {
  transform: translate(-2px, -2px);
  background: var(--card-hover);
  border-color: var(--gold);
  box-shadow: 8px 8px 0 rgba(0, 0, 0, .55), 0 0 22px rgba(255, 210, 122, .5);
  outline: none;
}
.link:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }

.link strong {
  display: block; font-family: "Silkscreen", sans-serif; font-weight: 700;
  font-size: 1rem; letter-spacing: .06em;
}
.link span {
  display: block; font-family: "VT323", monospace;
  color: var(--muted); font-size: 1.2rem; margin-top: 2px;
}

/* little arrow on the right */
.link::after {
  content: "\25B6"; font-size: .8rem;
  position: absolute; right: 22px; top: 50%;
  transform: translateY(-50%); opacity: .6; color: var(--gold);
  transition: transform .12s ease, opacity .12s ease;
}
.link:hover::after { transform: translate(5px, -50%); opacity: 1; }

/* The highlighted box (primary: true) */
.link.primary {
  padding: 24px;
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
  border-color: #fff2cf; color: var(--btn-text);
  box-shadow: 6px 6px 0 rgba(0, 0, 0, .55);
}
.link.primary:hover, .link.primary:focus-visible {
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
  filter: brightness(1.08);
  box-shadow: 9px 9px 0 rgba(0, 0, 0, .55), 0 0 26px rgba(255, 193, 90, .6);
}
.link.primary::after { display: none; }
.link.primary strong { font-size: 1.2rem; letter-spacing: .1em; }
.link.primary span { color: var(--btn-text); opacity: .85; }

footer {
  margin-top: 40px; font-family: "VT323", monospace;
  font-size: 1.15rem; letter-spacing: .15em; text-transform: uppercase;
  color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .85);
}

/* fade-in when the page loads */
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.avatar, h1, .tagline, .bio, .section-title, .link, footer { animation: rise .5s ease backwards; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* smaller phones */
@media (max-width: 420px) {
  .link { padding: 18px 40px; }
  .link strong { font-size: .92rem; }
}
</style>
</head>

<body>
<main id="app"></main>

<script>
/* =====================================================================
   PART 1 OF 3: YOUR CONTENT  <<< EDIT THIS PART
   ===================================================================== */

const CONFIG = {

  // ----- Page info -----
  pageTitle: "ACADEMIC AND RESEARCH BAND LINKS",   // text on the browser tab
  name:      "RADIO ENGINEERING CIRCLE",
  tagline:   "ACADEMIC AND RESEARCH BAND",
  bio:       "This page is dedicated solely for organizational work",   // "" to hide
  avatar:    "avatar.png",          // your logo/photo file; "" to hide
  footerName: "2027 RADIO ENGINEERING CIRCLE",   // "" to hide the footer

  // ----- Buttons -----
  // - To HIDE a link or group:    set  show: false   (or delete it)
  // - To ADD a link:              copy one line and change it
  // - To make a button stand out: add  primary: true
  // - Paste each link between the quotes after  url:
  groups: [

    {
      title: "",
      links: [
        { label: "Leaderboard", note: "spreadsheet link", url: "https://docs.google.com/spreadsheets/d/1VRIOXPtysbKZPeQSMcz1xXxmaXlZhHR1CFLTUHc0vD0/edit?usp=drive_link", primary: true, show: true },
      ]
    },

    {
      title: "Directories",
      links: [
        { label: "ANNOUNCEMENTS",     note: "gdocs link",        url: "", show: true },   // PASTE LINK
        { label: "WORKING DOCS FILE", note: "gdocs link",        url: "", show: true },   // PASTE LINK
        { label: "GOOGLE DRIVE",      note: "gdrive link",       url: "", show: true },   // PASTE LINK
        { label: "SUBMISSION BIN",    note: "spreadsheet link",  url: "", show: true },   // PASTE LINK
        { label: "TASK TRACKER",      note: "spreadsheet link",  url: "", show: true },   // PASTE LINK
        { label: "RESOURCES",         note: "gdocs link",        url: "", show: true },   // PASTE LINK
      ]
    },

    {
      title: "Contact",
      links: [
        { label: "Facebook", note: "Carl Delgado", url: "https://www.facebook.com/carl.delgado.739978", show: true },
      ]
    },

  ]
};


/* =====================================================================
   PART 3 OF 3: PAGE BUILDER  <<< DON'T TOUCH
   ===================================================================== */

(function () {
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  document.title = CONFIG.pageTitle;

  let html = "";
  if (CONFIG.avatar) {
    html += `<img class="avatar" src="${esc(CONFIG.avatar)}" alt="${esc(CONFIG.name)}" onerror="this.style.display='none'">`;
  }
  html += `<h1>${esc(CONFIG.name)}</h1>`;
  if (CONFIG.tagline) html += `<p class="tagline">${esc(CONFIG.tagline)}</p>`;
  if (CONFIG.bio)     html += `<p class="bio">${esc(CONFIG.bio)}</p>`;

  html += `<div class="links">`;
  CONFIG.groups.forEach(g => {
    const visible = (g.links || []).filter(l => l.show !== false);
    if (!visible.length) return;
    if (g.title) html += `<p class="section-title">${esc(g.title)}</p>`;
    visible.forEach(l => {
      const external = /^https?:/i.test(l.url) ? ' target="_blank" rel="noopener"' : "";
      html += `<a class="link${l.primary ? " primary" : ""}" href="${esc(l.url)}"${external}>` +
              `<strong>${esc(l.label)}</strong>` +
              (l.note ? `<span>${esc(l.note)}</span>` : "") +
              `</a>`;
    });
  });
  html += `</div>`;

  if (CONFIG.footerName) {
    html += `<footer>&copy; ${new Date().getFullYear()} ${esc(CONFIG.footerName)}</footer>`;
  }

  document.getElementById("app").innerHTML = html;
})();
</script>
</body>
</html>
