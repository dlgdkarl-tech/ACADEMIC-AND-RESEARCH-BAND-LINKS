<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   PART 2 OF 3: LOOK AND FEEL (optional to edit)
   Needs a background picture named bg.jpg in the same folder.
   ===================================================================== */

/* ---------- COLORS: safe to edit ---------- */
:root {
  --text: #ffffff;
  --muted: rgba(255, 245, 230, .92);
  --card: rgba(30, 18, 12, .70);          /* box fill */
  --card-hover: rgba(52, 30, 18, .82);    /* box fill when hovered */
  --border: rgba(255, 210, 150, .55);     /* box outline */
  --gold: #ffd27a;                        /* hover glow and accents */
  --gold-light: #ffd9a0;                  /* tagline color */
  --btn-top: #ffc15a;                     /* highlighted button, top */
  --btn-bottom: #ff7a3c;                  /* highlighted button, bottom */
  --btn-text: #2a1405;                    /* highlighted button text */
  --shade-top: rgba(0, 0, 0, .22);        /* darkening over the picture */
  --shade-bottom: rgba(0, 0, 0, .55);
}

/* ---------- LAYOUT: you can leave this alone ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Poppins", system-ui, sans-serif;
  background: #2a1a3a;
  color: var(--text);
  min-height: 100vh; display: flex; justify-content: center;
  padding: 60px 18px 96px; line-height: 1.4;
}

/* background pictures: one layer per page, crossfading (set in the script) */
.bg-layer {
  position: fixed; inset: 0; z-index: -1; opacity: 0; transition: opacity .5s ease;
  background-size: cover; background-position: center; background-repeat: no-repeat;
}
.bg-layer.show { opacity: 1; }

main { width: 100%; max-width: 520px; text-align: center; }

.avatar {
  width: 128px; height: 128px; border-radius: 12px; object-fit: cover;
  border: 3px solid var(--gold);
  box-shadow: 6px 6px 0 rgba(0, 0, 0, .55);
  background: var(--card); margin-bottom: 22px;
}

/* Title */
h1 {
  font-family: "Silkscreen", sans-serif; font-weight: 700;
  font-size: clamp(1.5rem, 6vw, 2.3rem); line-height: 1.2;
  letter-spacing: .04em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff, #ffd9a0);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, .6));
}

/* Tagline and bio */
.tagline {
  font-family: "VT323", monospace;
  font-size: clamp(1.3rem, 4.5vw, 1.7rem);
  letter-spacing: .12em; margin-top: 8px; color: var(--gold-light);
  text-shadow: 2px 2px 0 rgba(0, 0, 0, .7);
}
.bio {
  font-family: "VT323", monospace;
  font-size: 1.35rem; max-width: 40ch; margin: 10px auto 0;
  color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .75);
}

.links { margin-top: 34px; display: flex; flex-direction: column; gap: 16px; }

/* Section headings (centered, line on both sides) */
.section-title {
  font-family: "Silkscreen", sans-serif; font-weight: 700;
  font-size: .85rem; letter-spacing: .22em; text-transform: uppercase;
  margin: 16px 0 -2px;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  color: var(--gold-light); text-shadow: 2px 2px 0 rgba(0, 0, 0, .8);
}
.section-title::before, .section-title::after {
  content: ""; flex: 1; height: 2px;
}
.section-title::before { background: linear-gradient(270deg, rgba(255,210,150,.8), transparent); }
.section-title::after  { background: linear-gradient(90deg,  rgba(255,210,150,.8), transparent); }

/* The boxes (blocky, with hard shadow) */
.link {
  position: relative; display: block; text-decoration: none; color: var(--text);
  text-align: center; padding: 20px 52px; border-radius: 6px;
  background: var(--card);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border: 2px solid var(--border);
  box-shadow: 5px 5px 0 rgba(0, 0, 0, .55);
  transition: transform .12s ease, border-color .12s ease,
              box-shadow .12s ease, background .12s ease;
}
.link:hover, .link:focus-visible {
  transform: translate(-2px, -2px);
  background: var(--card-hover);
  border-color: var(--gold);
  box-shadow: 8px 8px 0 rgba(0, 0, 0, .55), 0 0 22px rgba(255, 210, 122, .5);
  outline: none;
}
.link:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }

.link strong {
  display: block; font-family: "Silkscreen", sans-serif; font-weight: 700;
  font-size: 1rem; letter-spacing: .06em;
}
.link span {
  display: block; font-family: "VT323", monospace;
  color: var(--muted); font-size: 1.2rem; margin-top: 2px;
}

/* little arrow on the right */
.link::after {
  content: "\25B6"; font-size: .8rem;
  position: absolute; right: 22px; top: 50%;
  transform: translateY(-50%); opacity: .6; color: var(--gold);
  transition: transform .12s ease, opacity .12s ease;
}
.link:hover::after { transform: translate(5px, -50%); opacity: 1; }

/* The highlighted box (primary: true) */
.link.primary {
  padding: 24px;
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
  border-color: #fff2cf; color: var(--btn-text);
  box-shadow: 6px 6px 0 rgba(0, 0, 0, .55);
}
.link.primary:hover, .link.primary:focus-visible {
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
  filter: brightness(1.08);
  box-shadow: 9px 9px 0 rgba(0, 0, 0, .55), 0 0 26px rgba(255, 193, 90, .6);
}
.link.primary::after { display: none; }
.link.primary strong { font-size: 1.2rem; letter-spacing: .1em; }
.link.primary span { color: var(--btn-text); opacity: .85; }

/* Back button on sub-pages */
.link.back { padding: 12px 40px; }
.link.back::after { display: none; }
.link.back strong { font-size: .85rem; }

/* Music button (bottom-right corner) */
.audio-ctl { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: flex; align-items: center; gap: 8px; }
.share-btn { position: fixed; right: 16px; top: 14px; z-index: 10; }
.vol-box {
  display: flex; align-items: center; padding: 0 12px; height: 40px;
  background: var(--card); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border: 2px solid var(--border); border-radius: 6px; box-shadow: 4px 4px 0 rgba(0, 0, 0, .55);
}
.vol {
  -webkit-appearance: none; appearance: none; width: 84px; height: 8px; border-radius: 2px;
  cursor: pointer; outline-offset: 6px;
  background: linear-gradient(90deg, var(--gold) var(--v, 50%), rgba(255, 255, 255, .25) var(--v, 50%));
}
.vol::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 20px; border-radius: 2px;
  background: var(--btn-top); border: 2px solid #fff2cf; box-shadow: 2px 2px 0 rgba(0, 0, 0, .55);
}
.vol::-moz-range-thumb { width: 10px; height: 16px; border-radius: 2px; background: var(--btn-top); border: 2px solid #fff2cf; }
.music-btn {
  font-family: "Silkscreen", sans-serif; font-weight: 700;
  font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text); background: var(--card); cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border: 2px solid var(--border); border-radius: 6px;
  padding: 10px 14px; box-shadow: 4px 4px 0 rgba(0, 0, 0, .55);
  transition: transform .12s ease, border-color .12s ease;
}
.music-btn:hover { border-color: var(--gold); transform: translate(-1px, -1px); }
.music-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }
.music-btn.on { background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom)); color: var(--btn-text); border-color: #fff2cf; }

/* "Tap to enter" screen (lets the music start right away) */
.gate {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: 24px; text-align: center; cursor: pointer;
  background: rgba(20, 10, 5, .88);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.gate h2 {
  font-family: "Silkscreen", sans-serif; font-weight: 700;
  font-size: clamp(1.2rem, 5vw, 1.8rem); letter-spacing: .06em; text-transform: uppercase;
  color: #fff; text-shadow: 3px 3px 0 rgba(0, 0, 0, .7);
}
.gate .enter-btn {
  font-family: "Silkscreen", sans-serif; font-weight: 700; font-size: 1.1rem;
  letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  padding: 18px 34px; border-radius: 6px;
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
  color: var(--btn-text); border: 2px solid #fff2cf;
  box-shadow: 6px 6px 0 rgba(0, 0, 0, .55);
  animation: pulse 1.2s ease-in-out infinite;
}
.gate .enter-btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 rgba(0, 0, 0, .55); }
.gate p { font-family: "VT323", monospace; font-size: 1.3rem; color: var(--gold-light); text-shadow: 2px 2px 0 rgba(0, 0, 0, .8); }
@keyframes pulse { 50% { transform: scale(1.05); } }

footer {
  margin-top: 40px; font-family: "VT323", monospace;
  font-size: 1.15rem; letter-spacing: .15em; text-transform: uppercase;
  color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .85);
}

/* Upcoming events */
.ev-card, .event {
  background: var(--card); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border: 2px solid var(--border); border-radius: 6px; box-shadow: 5px 5px 0 rgba(0, 0, 0, .55);
}
/* the highlighted "next event" card */
.ev-card {
  padding: 0; overflow: hidden; border-color: var(--gold);
  background: linear-gradient(180deg, rgba(70, 38, 18, .86), rgba(30, 18, 12, .86));
  box-shadow: 6px 6px 0 rgba(0, 0, 0, .55), 0 0 26px rgba(255, 193, 90, .45);
}
.ev-label {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  font-family: "Silkscreen", sans-serif; font-weight: 700; font-size: .75rem; letter-spacing: .22em;
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom)); color: var(--btn-text);
  border-bottom: 2px solid #fff2cf;
}
.ev-label::before { content: ""; width: 8px; height: 8px; background: var(--btn-text); animation: pulse 1.2s ease-in-out infinite; }
.ev-body { padding: 18px 16px 16px; }
.ev-title { font-family: "Silkscreen", sans-serif; font-weight: 700; font-size: clamp(1.05rem, 4.6vw, 1.35rem); line-height: 1.25; text-shadow: 3px 3px 0 rgba(0, 0, 0, .6); }
.ev-when { font-family: "VT323", monospace; font-size: 1.25rem; color: var(--muted); }
.ev-empty { font-family: "VT323", monospace; font-size: 1.3rem; color: var(--muted); }
.countdown { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
.countdown div { min-width: 62px; padding: 8px 6px; background: rgba(0, 0, 0, .55); border: 2px solid var(--gold); border-radius: 4px; box-shadow: 3px 3px 0 rgba(0, 0, 0, .55); }
.countdown b { display: block; font-family: "Silkscreen", sans-serif; font-size: 1.7rem; color: var(--gold); text-shadow: 2px 2px 0 rgba(0, 0, 0, .6); }
.countdown small { font-family: "VT323", monospace; font-size: 1rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.event { display: flex; align-items: center; gap: 14px; padding: 12px 14px; text-align: left; }
.date-badge {
  flex: none; width: 56px; padding: 6px 0; text-align: center; border-radius: 4px;
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
  color: var(--btn-text); border: 2px solid #fff2cf; font-family: "Silkscreen", sans-serif;
}
.date-badge small { display: block; font-size: .6rem; letter-spacing: .1em; }
.date-badge b { display: block; font-size: 1.3rem; line-height: 1.1; }
.event strong { display: block; font-family: "Silkscreen", sans-serif; font-size: .85rem; letter-spacing: .04em; }
.event span { display: block; font-family: "VT323", monospace; font-size: 1.15rem; color: var(--muted); }

.ev-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.ev-card .ev-actions { justify-content: center; margin-top: 14px; }
.ev-actions .music-btn { padding: 6px 10px; font-size: .65rem; text-decoration: none; display: inline-block; box-shadow: 3px 3px 0 rgba(0, 0, 0, .55); }

/* On-page event editor */
.share-panel.wide { max-width: 560px; text-align: left; }
.ed-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; margin-bottom: 12px; background: rgba(0, 0, 0, .35); border: 2px solid var(--border); border-radius: 4px; }
.ed-f { display: block; min-width: 0; }
.ed-f.w, .ed-end, .ed-pin { grid-column: 1 / -1; }
.ed-f span { display: block; font-family: "Silkscreen", sans-serif; font-size: .55rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 3px; }
.share-panel input[type=text], .share-panel input[type=date], .share-panel input[type=time], .share-panel input[type=number], .share-panel input[type=url], .share-panel input[type=password] {
  width: 100%; padding: 8px; font: .85rem "Poppins", sans-serif; color: #fff; color-scheme: dark;
  background: rgba(0, 0, 0, .5); border: 2px solid var(--border); border-radius: 4px;
}
.ed-end { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ed-c { font-size: .8rem; display: flex; align-items: center; gap: 6px; }
.ed-end .music-btn { margin-left: auto; padding: 6px 10px; font-size: .65rem; }
.ed-status { font-family: "VT323", monospace; font-size: 1.2rem; color: var(--gold-light); min-height: 1.3em; margin-top: 10px; }

/* Share window + QR poster */
.share-modal {
  position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
  padding: 18px; background: rgba(20, 10, 5, .82); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.share-panel {
  position: relative; width: 100%; max-width: 360px; max-height: 100%; overflow: auto;
  padding: 22px 18px 18px; text-align: center; background: var(--card-hover);
  border: 2px solid var(--gold); border-radius: 6px; box-shadow: 6px 6px 0 rgba(0, 0, 0, .55);
}
.share-panel .section-title { margin: 0 0 14px; }
.poster { background: #fff; color: #1a1008; padding: 14px; border-radius: 4px; }
.poster h3 { font-family: "Silkscreen", sans-serif; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
.poster svg { display: block; width: 100%; max-width: 240px; margin: 10px auto; }
.poster .cap { font-family: "VT323", monospace; font-size: 1.3rem; }
.poster .u { font-size: .7rem; word-break: break-all; opacity: .7; }
.share-row { display: flex; gap: 8px; margin-top: 14px; }
.share-row .music-btn { flex: 1; padding: 10px 6px; }
.share-note { font-family: "VT323", monospace; font-size: 1.1rem; color: var(--gold-light); margin-top: 10px; }
.music-btn.x { position: absolute; top: 8px; right: 8px; padding: 4px 8px; }
.music-btn.primary { background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom)); color: var(--btn-text); border-color: #fff2cf; }

/* fade-in when the page loads */
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.avatar, h1, .tagline, .bio, .section-title, .link, .ev-card, .event, footer { animation: rise .5s ease backwards; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* smaller phones */
@media (max-width: 420px) {
  .link { padding: 18px 40px; }
  .link strong { font-size: .92rem; }
  .vol { width: 60px; }
  .countdown { gap: 6px; }
  .countdown div { min-width: 56px; }
}

/* Print only the QR poster (used by the Print button in the Share window) */
@media print {
  body.qr-print { display: block; padding: 0; background: #fff; }
  body.qr-print > *:not(.share-modal) { display: none !important; }
  body.qr-print .share-modal { position: static; display: block; padding: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  body.qr-print .share-panel { max-width: none; border: 0; box-shadow: none; background: none; padding: 0; overflow: visible; }
  body.qr-print .share-panel > *:not(.poster) { display: none !important; }
  body.qr-print .poster { padding: .5in; color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body.qr-print .poster h3 { font-size: 28pt; }
  body.qr-print .poster svg { max-width: 6in; }
  body.qr-print .poster .cap { font-size: 24pt; }
  body.qr-print .poster .u { font-size: 14pt; opacity: 1; }
}
</style>
</head>

    const bit = (x, i) => ((x >>> i) & 1) != 0;
    for (let i = 0; i < n; i++) { set(6, i, i % 2 == 0); set(i, 6, i % 2 == 0); }
    [[3, 3], [n - 4, 3], [3, n - 4]].forEach(([x, y]) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x + dx, y + dy, d != 2 && d != 4); } });
    const na = ver > 1 ? Math.floor(ver / 7) + 2 : 0, step = na ? Math.floor((ver * 8 + na * 3 + 5) / (na * 4 - 4)) * 2 : 0, pos = na ? [6] : [];
    for (let q = n - 7; pos.length < na; q -= step) pos.splice(1, 0, q);
    pos.forEach((i, a) => pos.forEach((j, b) => {
      if ((a == 0 && b == 0) || (a == 0 && b == na - 1) || (a == na - 1 && b == 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(i + dx, j + dy, Math.max(Math.abs(dx), Math.abs(dy)) != 1);
    }));
    if (ver >= 7) { let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = ver << 12 | r; for (let i = 0; i < 18; i++) { const a = n - 11 + i % 3, c = Math.floor(i / 3); set(a, c, bit(b, i)); set(c, a, bit(b, i)); } }
    const fmt = m => {
      let r = m; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = (m << 10 | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) set(8, i, bit(b, i));
      set(8, 7, bit(b, 6)); set(8, 8, bit(b, 7)); set(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) set(n - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) set(8, n - 15 + i, bit(b, i));
      set(8, n - 8, true);
    };
    fmt(0);
    // place the data
    for (let right = n - 1, bi = 0; right >= 1; right -= 2) {
      if (right == 6) right = 5;
      for (let v = 0; v < n; v++) for (let j = 0; j < 2; j++) {
        const x = right - j, y = ((right + 1) & 2) == 0 ? n - 1 - v : v;
        if (!F[y][x] && bi < cw.length * 8) { M[y][x] = bit(cw[bi >>> 3], 7 - (bi & 7)); bi++; }
      }
    }
    // pick the best mask
    const rules = [(x, y) => (x + y) % 2 == 0, (x, y) => y % 2 == 0, (x, y) => x % 3 == 0, (x, y) => (x + y) % 3 == 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 == 0, (x, y) => x * y % 2 + x * y % 3 == 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 == 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 == 0];
    const apply = m => { for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!F[y][x] && rules[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      const line = a => {
        let run = 1;
        for (let i = 1; i <= n; i++) { if (i < n && a[i] == a[i - 1]) run++; else { if (run >= 5) p += run - 2; run = 1; } }
        const t = a.map(c => c ? 1 : 0).join("");
        ["10111010000", "00001011101"].forEach(pt => { let k = -1; while ((k = t.indexOf(pt, k + 1)) >= 0) p += 40; });
      };
      for (let y = 0; y < n; y++) {
        line(M[y]); line(M.map(r => r[y]));
        for (let x = 0; x < n; x++) { if (M[y][x]) dark++; if (x && y && M[y][x] == M[y][x - 1] && M[y][x] == M[y - 1][x] && M[y][x] == M[y - 1][x - 1]) p += 3; }
      }
      return p + (Math.ceil(Math.abs(dark * 20 - n * n * 10) / (n * n)) - 1) * 10;
    };
    let best = 0, bp = Infinity;
    for (let m = 0; m < 8; m++) { apply(m); fmt(m); const p = penalty(); if (p < bp) { bp = p; best = m; } apply(m); }
    apply(best); fmt(best);
    return M;
  }

  // ----- Share button: copy link + QR code (save / print) -----
  (function () {
    const shareBtn = document.createElement("button");
    shareBtn.type = "button"; shareBtn.className = "music-btn share-btn"; shareBtn.textContent = "Share";
    document.body.appendChild(shareBtn);

    let modal = null;
    const shareUrl = () => CONFIG.shareUrl || location.href.split("#")[0];
    const qrSVG = m => {
      const n = m.length; let d = "";
      m.forEach((r, y) => { for (let x = 0; x < n;) { if (r[x]) { const s = x; while (x < n && r[x]) x++; d += `M${s + 4} ${y + 4}h${x - s}v1h${s - x}z`; } else x++; } });
      return `<svg viewBox="0 0 ${n + 8} ${n + 8}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}"/></svg>`;
    };
    const copy = t => (navigator.clipboard && window.isSecureContext)
      ? navigator.clipboard.writeText(t).then(() => true, () => false)
      : new Promise(res => {
          const ta = document.createElement("textarea"); ta.value = t; ta.style.cssText = "position:fixed;opacity:0";
          document.body.appendChild(ta); ta.select(); let ok = false;
          try { ok = document.execCommand("copy"); } catch (e) {}
          ta.remove(); res(ok);
        });
    const flash = (b, t) => { const o = b.textContent; b.textContent = t; setTimeout(() => { b.textContent = o; }, 1500); };
    const savePNG = m => {
      const n = m.length, s = Math.max(8, Math.ceil(1000 / (n + 8))), c = document.createElement("canvas");
      c.width = c.height = (n + 8) * s;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#000";
      m.forEach((r, y) => r.forEach((v, x) => { if (v) g.fillRect((x + 4) * s, (y + 4) * s, s, s); }));
      const a = document.createElement("a"); a.href = c.toDataURL("image/png");
      a.download = (CONFIG.name || "page").toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-qr.png"; a.click();
    };
    const close = () => { if (modal) { modal.remove(); modal = null; shareBtn.focus(); } };

    function open() {
      const u = shareUrl(), m = makeQR(u);
      modal = document.createElement("div"); modal.className = "share-modal";
      modal.innerHTML = `<div class="share-panel" role="dialog" aria-modal="true" aria-label="Share this page">` +
        `<button type="button" class="music-btn x" data-act="close" aria-label="Close">\u2715</button>` +
        `<p class="section-title">Share this page</p>` +
        `<div class="poster"><h3>${esc(CONFIG.name)}</h3>${m ? qrSVG(m) : ""}<p class="cap">${esc(CONFIG.shareCaption || "")}</p><p class="u">${esc(u)}</p></div>` +
        (location.protocol === "file:" && !CONFIG.shareUrl ? `<p class="share-note">Set shareUrl in CONFIG once the page is online, so the QR opens the real link.</p>` : "") +
        `<div class="share-row"><button type="button" class="music-btn primary" data-act="copy">Copy link</button>` +
        (m ? `<button type="button" class="music-btn" data-act="save">Save QR</button><button type="button" class="music-btn" data-act="print">Print</button>` : "") +
        `</div></div>`;
      modal.addEventListener("click", e => {
        const a = e.target.closest("[data-act]");
        if (e.target === modal || (a && a.dataset.act === "close")) return close();
        if (!a) return;
        if (a.dataset.act === "copy") copy(u).then(ok => flash(a, ok ? "Copied!" : "Copy failed"));
        else if (a.dataset.act === "save") savePNG(m);
        else if (a.dataset.act === "print") { document.body.classList.add("qr-print"); window.print(); }
      });
      document.body.appendChild(modal);
      modal.querySelector('[data-act="copy"]').focus();
    }
    shareBtn.addEventListener("click", open);
    document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
    window.addEventListener("afterprint", () => document.body.classList.remove("qr-print"));
  })();

  // ----- Events from a Google Sheet (optional) -----
  const csvRows = t => {
    const rows = []; let r = [], f = "", q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) { if (c == '"') { if (t[i + 1] == '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c == '"') q = true;
      else if (c == ",") { r.push(f); f = ""; }
      else if (c == "\n" || c == "\r") { if (c == "\r" && t[i + 1] == "\n") i++; r.push(f); f = ""; rows.push(r); r = []; }
      else f += c;
    }
    if (f !== "" || r.length) { r.push(f); rows.push(r); }
    return rows;
  };
  const p2 = n => String(n).padStart(2, "0");
  const normDate = v => {
    v = (v || "").trim();
    const m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
    const d = new Date(v);
    return isNaN(d) ? "" : `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  };
  const normTime = v => {
    const m = (v || "").trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap]m)?/i);
    if (!m) return "";
    let h = +m[1];
    if (m[3]) { const pm = m[3].toLowerCase() == "pm"; if (pm && h < 12) h += 12; if (!pm && h == 12) h = 0; }
    return `${p2(h)}:${m[2]}`;
  };
  const isNo = v => /^(false|no|0|hide|off)$/i.test((v || "").trim());
  function sheetEvents(text) {
    const rows = csvRows(text);
    if (!rows.length) return null;
    const h = rows[0].map(x => x.trim().toLowerCase());
    if (h.indexOf("date") < 0 || h.indexOf("title") < 0) return null;   // not our sheet (e.g. a login page)
    return rows.slice(1).map(r => {
      const g = k => h.indexOf(k) < 0 ? "" : (r[h.indexOf(k)] || "").trim();
      return { date: normDate(g("date")), time: normTime(g("time")), title: g("title"), type: g("type"), note: g("note"),
               link: g("link"), duration: +g("duration") || 60, show: !isNo(g("show")), countdown: !isNo(g("countdown")) };
    }).filter(e => e.date && e.title);
  }
  if (CONFIG.eventsSheet || CONFIG.eventsApi) {   // start from the last saved copy so old/sample events never flash
    let cache = null; try { cache = JSON.parse(localStorage.getItem("events-cache") || "null"); } catch (e) {}
    CONFIG.events = Array.isArray(cache) ? cache : [];
  }
  const normEv = o => ({ date: normDate(o.date), time: normTime(o.time), title: (o.title || "").trim(), type: (o.type || "").trim(),
    note: (o.note || "").trim(), link: (o.link || "").trim(), duration: +o.duration || 60, show: !isNo(String(o.show === undefined ? "" : o.show)),
    countdown: !isNo(String(o.countdown === undefined ? "" : o.countdown)) });
  function applyEvents(ev) {
    CONFIG.events = ev;
    try { localStorage.setItem("events-cache", JSON.stringify(ev)); } catch (e) {}
    render(true);
  }
  function loadSheet() {
    if (CONFIG.eventsApi) {
      fetch(CONFIG.eventsApi).then(r => r.json()).then(j => {
        if (j && Array.isArray(j.events)) applyEvents(j.events.map(normEv).filter(e => e.date && e.title));
      }).catch(() => {});
      return;
    }
    if (!CONFIG.eventsSheet) return;
    const u = CONFIG.eventsSheet + (CONFIG.eventsSheet.includes("?") ? "&" : "?") + "t=" + Date.now();
    fetch(u).then(r => { if (!r.ok) throw 0; return r.text(); }).then(t => {
      const ev = sheetEvents(t);
      if (!ev) return;
      applyEvents(ev);
    }).catch(() => {});
  }
  setInterval(loadSheet, 300000);   // re-check every 5 minutes

  // ----- On-page event editor (open with #edit, saves to your Google Sheet) -----
  function openEditor() {
    const draft = JSON.parse(JSON.stringify(CONFIG.events || []));
    const now = new Date(), today = `${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())}`;
    let pin = "";
    const m = document.createElement("div"); m.className = "share-modal";
    const fld = (i, k, label, type, cls) => `<label class="ed-f ${cls || ""}"><span>${label}</span><input type="${type}" data-i="${i}" data-k="${k}" value="${esc(draft[i][k] === undefined ? "" : draft[i][k])}"></label>`;
    const row = (e, i) => `<div class="ed-row">` + fld(i, "title", "Event name", "text", "w") + fld(i, "date", "Date", "date") + fld(i, "time", "Time (blank = all day)", "time") +
      fld(i, "type", "Type", "text") + fld(i, "duration", "Minutes", "number") + fld(i, "link", "Meeting link (Teams)", "url", "w") + fld(i, "note", "Note", "text", "w") +
      `<div class="ed-end"><label class="ed-c"><input type="checkbox" data-i="${i}" data-k="show"${e.show !== false ? " checked" : ""}> Show</label>` +
      `<label class="ed-c"><input type="checkbox" data-i="${i}" data-k="countdown"${e.countdown !== false ? " checked" : ""}> Timer</label>` +
      `<button type="button" class="music-btn" data-del="${i}">Delete</button></div></div>`;
    const paint = () => {
      m.innerHTML = `<div class="share-panel wide" role="dialog" aria-modal="true" aria-label="Edit events"><p class="section-title">Edit events</p>` +
        `<label class="ed-f ed-pin" style="margin-bottom:12px"><span>Edit PIN</span><input type="password" data-pin autocomplete="off" value="${esc(pin)}"></label>` +
        (draft.map(row).join("") || `<p class="ev-empty">No events yet.</p>`) +
        `<div class="share-row"><button type="button" class="music-btn" data-add>+ Add event</button><button type="button" class="music-btn primary" data-save>Save</button><button type="button" class="music-btn" data-cancel>Cancel</button></div>` +
        `<p class="ed-status" id="ed-status"></p></div>`;
    };
    const say = t => { const el = m.querySelector("#ed-status"); if (el) el.textContent = t; };
    m.addEventListener("input", e => {
      const t = e.target;
      if (t.hasAttribute("data-pin")) pin = t.value;
      else if (t.dataset.k) draft[+t.dataset.i][t.dataset.k] = t.type === "checkbox" ? t.checked : t.value;
    });
    m.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (e.target === m || (b && b.hasAttribute("data-cancel"))) return m.remove();
      if (!b) return;
      if (b.hasAttribute("data-add")) { draft.push({ date: today, time: "", title: "New event", type: "Meeting", note: "", link: "", duration: 60, show: true, countdown: true }); const y = m.querySelector(".share-panel").scrollTop; paint(); m.querySelector(".share-panel").scrollTop = y + 9999; }
      else if (b.dataset.del !== undefined) { if (confirm("Delete this event?")) { draft.splice(+b.dataset.del, 1); const y = m.querySelector(".share-panel").scrollTop; paint(); m.querySelector(".share-panel").scrollTop = y; } }
      else if (b.hasAttribute("data-save")) {
        if (draft.some(x => !String(x.title).trim() || !x.date)) return say("Every event needs a name and a date.");
        if (!pin) return say("Enter the edit PIN.");
        draft.sort((a, b2) => (a.date + (a.time || "")).localeCompare(b2.date + (b2.time || "")));
        say("Saving...");
        const out = draft.map(x => ({ ...x, duration: +x.duration || 60, show: x.show === false ? "FALSE" : "TRUE", countdown: x.countdown === false ? "FALSE" : "TRUE" }));
        fetch(CONFIG.eventsApi, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ pin, events: out }) })
          .then(r => r.json()).then(r => {
            if (!r.ok) return say(r.error === "pin" ? "Wrong PIN." : "Could not save.");
            applyEvents(draft.map(x => ({ ...x, duration: +x.duration || 60 })));
            m.remove();
          }).catch(() => say("Could not reach the sheet. Check eventsApi."));
      }
    });
    paint();
    document.body.appendChild(m);
  }
  function checkEdit() {
    if (location.hash !== "#edit") return;
    history.replaceState(null, "", location.pathname + location.search);
    if (CONFIG.eventsApi) openEditor();
  }

  window.addEventListener("hashchange", () => { render(); checkEdit(); });
  render();
  loadSheet();
  checkEdit();
})();
</script>
</body>
</html>
